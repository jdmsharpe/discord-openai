# OpenAI model pricing catalog.
#
# Canonical source: https://developers.openai.com/api/docs/pricing
# Cross-referenced against: https://github.com/pydantic/genai-prices/blob/main/prices/providers/openai.yml
# Last-verified: 2026-09-03
#
# All chat-model prices are USD per million tokens. Cached input tokens are
# billed at cached_input_per_million when present, else at 50% of input.
#
# THE 50% FALLBACK IS A LAST RESORT, NOT A RULE. OpenAI's published cached
# discount varies by generation — 90% off for the gpt-5 family, 75% off for
# gpt-4.1/o3/o4-mini, 50% off for the gpt-4o/o1/o3-mini generation — so any
# single fallback is wrong for most of the catalog. Every model with a
# published cached rate MUST declare it here; relying on the fallback has
# silently overbilled cached input twice (5x on gpt-5, 2x on gpt-4.1/o3).
# `test_declared_cached_rates_match_published` enforces this: a model missing
# the field must be listed in NO_PUBLISHED_CACHED_RATE, which is limited to the
# Pro tiers and legacy ids that genuinely publish no cached price.
# Reasoning tokens are billed at the standard output price (already aggregated
# into output_tokens by the API).
#
# cache_write_per_million: GPT-5.6+ bills the tokens WRITTEN to the prompt cache
# (usage.input_tokens_details.cache_write_tokens) at 1.25x the uncached input
# rate — the pricing table's "Cache writes" column. Every other row prints "-"
# there (no surcharge), so only the gpt-5.6 rows declare it; a model without the
# field bills cache-write tokens as ordinary input.
# `test_gpt_5_6_cache_write_rates_are_125_percent_of_input` pins the ratio.
#
# long_context: GPT-5.4 / 5.4 Pro / 5.5 / 5.5 Pro and the GPT-5.6 trio carry a
# second tier once a request's prompt exceeds 272K input tokens (pricing page:
# "Short context <=272K input tokens" / "Long context >272K"; model pages:
# "prompts with >272K input tokens are priced at 2x input and 1.5x output for
# the full session"), so threshold_tokens is 272001 and the WHOLE request —
# input, cached input, cache writes and output — bills at the tier rates, not
# just the overflow. OpenAI does not say whether 272K is 272,000 or 278,528
# (272 x 1024) tokens; 272,000 is assumed, matching colmad. Rows without the
# block bill flat at any prompt size. `test_long_context_tiers_are_pinned` pins
# the published tier rates.
#
# fast: Fast mode (formerly "Priority processing", renamed 2026-07-30) is opted
# into per request with service_tier "fast" (or "priority"; the response echoes
# "priority") and bills every bucket at the rates on the pricing page's "Fast
# mode" tab — 2x standard for the GPT-5.6 trio, other multiples elsewhere.
# The tab publishes one rate per model (the GPT-5.5 / 5.4 rows are labelled
# "<272K context length" and no long-context fast rate exists), so a fast
# request bills these rates at any prompt size and the long_context block is
# ignored for it. Rows without the block cannot be requested with Fast mode
# (`service_tier_error`). "ultrafast" (GPT-5.6 Sol only, limited preview since
# 2026-08-13) has no published price and is not offered. `test_fast_tiers_are_pinned`
# pins the published rates.
#
# Override this file at runtime by setting OPENAI_PRICING_PATH to an alternate
# YAML path — useful for pushing new pricing without a code release.

models:
  # gpt-5.6-sol: promotional rate, guaranteed at least through 2026-11-21 (changelog 2026-08-21) - re-verify after that date
  gpt-5.6-sol:
    input_per_million: 4.00
    output_per_million: 20.00
    cached_input_per_million: 0.40
    cache_write_per_million: 5.00
    long_context: { threshold_tokens: 272001, input_per_million: 8.00, output_per_million: 30.00, cached_input_per_million: 0.80, cache_write_per_million: 10.00 }
    fast: { input_per_million: 8.00, output_per_million: 40.00, cached_input_per_million: 0.8, cache_write_per_million: 10.00 }
  gpt-5.6-terra:
    input_per_million: 2.00
    output_per_million: 12.00
    cached_input_per_million: 0.20
    cache_write_per_million: 2.50
    long_context: { threshold_tokens: 272001, input_per_million: 4.00, output_per_million: 18.00, cached_input_per_million: 0.40, cache_write_per_million: 5.00 }
    fast: { input_per_million: 4.00, output_per_million: 24.00, cached_input_per_million: 0.4, cache_write_per_million: 5.00 }
  gpt-5.6-luna:
    input_per_million: 0.20
    output_per_million: 1.20
    cached_input_per_million: 0.02
    cache_write_per_million: 0.25
    long_context: { threshold_tokens: 272001, input_per_million: 0.40, output_per_million: 1.80, cached_input_per_million: 0.04, cache_write_per_million: 0.50 }
    fast: { input_per_million: 0.40, output_per_million: 2.40, cached_input_per_million: 0.04, cache_write_per_million: 0.50 }
  # The Pro tiers publish no cached-input rate at either tier.
  gpt-5.5-pro:
    input_per_million: 30.00
    output_per_million: 180.00
    long_context: { threshold_tokens: 272001, input_per_million: 60.00, output_per_million: 270.00 }
  gpt-5.5:
    input_per_million: 5.00
    output_per_million: 30.00
    cached_input_per_million: 0.50
    long_context: { threshold_tokens: 272001, input_per_million: 10.00, output_per_million: 45.00, cached_input_per_million: 1.00 }
    fast: { input_per_million: 12.50, output_per_million: 75.00, cached_input_per_million: 1.25 }
  gpt-5.4-pro:
    input_per_million: 30.00
    output_per_million: 180.00
    long_context: { threshold_tokens: 272001, input_per_million: 60.00, output_per_million: 270.00 }
  gpt-5.4:
    input_per_million: 2.50
    output_per_million: 15.00
    cached_input_per_million: 0.25
    long_context: { threshold_tokens: 272001, input_per_million: 5.00, output_per_million: 22.50, cached_input_per_million: 0.50 }
    fast: { input_per_million: 5.00, output_per_million: 30.00, cached_input_per_million: 0.5 }
  gpt-5.4-mini:
    input_per_million: 0.75
    output_per_million: 4.50
    cached_input_per_million: 0.075
    fast: { input_per_million: 1.50, output_per_million: 9.00, cached_input_per_million: 0.15 }
  gpt-5.4-nano:      { input_per_million: 0.20,   output_per_million: 1.25,   cached_input_per_million: 0.02 }
  gpt-5.3-chat-latest: { input_per_million: 1.75, output_per_million: 14.00, cached_input_per_million: 0.175 }
  gpt-5.2-pro:       { input_per_million: 21.00,  output_per_million: 168.00 }
  gpt-5.2:
    input_per_million: 1.75
    output_per_million: 14.00
    cached_input_per_million: 0.175
    fast: { input_per_million: 3.50, output_per_million: 28.00, cached_input_per_million: 0.35 }
  gpt-5.1:
    input_per_million: 1.25
    output_per_million: 10.00
    cached_input_per_million: 0.125
    fast: { input_per_million: 2.50, output_per_million: 20.00, cached_input_per_million: 0.25 }
  gpt-5-pro:         { input_per_million: 15.00,  output_per_million: 120.00 }
  gpt-5:
    input_per_million: 1.25
    output_per_million: 10.00
    cached_input_per_million: 0.125
    fast: { input_per_million: 2.50, output_per_million: 20.00, cached_input_per_million: 0.25 }
  gpt-5-mini:
    input_per_million: 0.25
    output_per_million: 2.00
    cached_input_per_million: 0.025
    fast: { input_per_million: 0.45, output_per_million: 3.60, cached_input_per_million: 0.045 }
  gpt-5-nano:        { input_per_million: 0.05,   output_per_million: 0.40,   cached_input_per_million: 0.005 }
  gpt-4.1:
    input_per_million: 2.00
    output_per_million: 8.00
    cached_input_per_million: 0.50
    fast: { input_per_million: 3.50, output_per_million: 14.00, cached_input_per_million: 0.875 }
  gpt-4.1-mini:
    input_per_million: 0.40
    output_per_million: 1.60
    cached_input_per_million: 0.10
    fast: { input_per_million: 0.70, output_per_million: 2.80, cached_input_per_million: 0.175 }
  gpt-4.1-nano:
    input_per_million: 0.10
    output_per_million: 0.40
    cached_input_per_million: 0.025
    fast: { input_per_million: 0.20, output_per_million: 0.80, cached_input_per_million: 0.05 }
  o4-mini:
    input_per_million: 1.10
    output_per_million: 4.40
    cached_input_per_million: 0.275
    fast: { input_per_million: 2.00, output_per_million: 8.00, cached_input_per_million: 0.5 }
  o3-pro:            { input_per_million: 20.00,  output_per_million: 80.00 }
  o3:
    input_per_million: 2.00
    output_per_million: 8.00
    cached_input_per_million: 0.50
    fast: { input_per_million: 3.50, output_per_million: 14.00, cached_input_per_million: 0.875 }
  o3-mini:           { input_per_million: 1.10,   output_per_million: 4.40,   cached_input_per_million: 0.55 }
  o1-pro:            { input_per_million: 150.00, output_per_million: 600.00 }
  o1:                { input_per_million: 15.00,  output_per_million: 60.00,  cached_input_per_million: 7.50 }
  gpt-4o:
    input_per_million: 2.50
    output_per_million: 10.00
    cached_input_per_million: 1.25
    fast: { input_per_million: 4.25, output_per_million: 17.00, cached_input_per_million: 2.125 }
  gpt-4o-mini:
    input_per_million: 0.15
    output_per_million: 0.60
    cached_input_per_million: 0.075
    fast: { input_per_million: 0.25, output_per_million: 1.00, cached_input_per_million: 0.125 }
  gpt-4:             { input_per_million: 30.00,  output_per_million: 60.00 }
  gpt-4-turbo:       { input_per_million: 10.00,  output_per_million: 30.00 }
  gpt-3.5-turbo:     { input_per_million: 0.50,   output_per_million: 1.50 }

tools:
  web_search:       { per_call: 0.01 }      # $10 / 1k calls
  file_search:      { per_call: 0.0025 }    # $2.50 / 1k calls (Responses API)
  code_interpreter: { per_call: 0.03 }      # $0.03 / container
  shell:            { per_call: 0.03 }      # Same billing as code_interpreter

# Image-generation pricing is nested per model → quality → size.
# "default_per_image" is used when quality or size is "auto".
image_generation:
  gpt-image-2:
    default_per_image: 0.053
    by_quality_size:
      low:
        1024x1024: 0.006
        1024x1536: 0.005
        1536x1024: 0.005
      medium:
        1024x1024: 0.053
        1024x1536: 0.041
        1536x1024: 0.041
      high:
        1024x1024: 0.211
        1024x1536: 0.165
        1536x1024: 0.165
  gpt-image-1.5:
    default_per_image: 0.034
    by_quality_size:
      low:
        1024x1024: 0.009
        1024x1536: 0.013
        1536x1024: 0.013
      medium:
        1024x1024: 0.034
        1024x1536: 0.05
        1536x1024: 0.05
      high:
        1024x1024: 0.133
        1024x1536: 0.20
        1536x1024: 0.20
  gpt-image-1:
    default_per_image: 0.042
    by_quality_size:
      low:
        1024x1024: 0.011
        1024x1536: 0.016
        1536x1024: 0.016
      medium:
        1024x1024: 0.042
        1024x1536: 0.063
        1536x1024: 0.063
      high:
        1024x1024: 0.167
        1024x1536: 0.25
        1536x1024: 0.25
  gpt-image-1-mini:
    default_per_image: 0.011
    by_quality_size:
      low:
        1024x1024: 0.005
        1024x1536: 0.006
        1536x1024: 0.006
      medium:
        1024x1024: 0.011
        1024x1536: 0.015
        1536x1024: 0.015
      high:
        1024x1024: 0.036
        1024x1536: 0.052
        1536x1024: 0.052

text_to_speech:
  tts-1:           { per_character: 0.000015 }  # $15 / 1M chars
  tts-1-hd:        { per_character: 0.000030 }  # $30 / 1M chars
  gpt-4o-mini-tts: { per_character: 0.000020 }  # ~$0.015/min at ~750 chars/min

speech_to_text:
  gpt-transcribe:             { per_minute: 0.0045 }
  gpt-4o-transcribe:          { per_minute: 0.006 }
  gpt-4o-transcribe-diarize:  { per_minute: 0.006 }
  gpt-4o-mini-transcribe:     { per_minute: 0.003 }
  whisper-1:                  { per_minute: 0.006 }

# Video pricing is per second of generated output, tiered by resolution.
# "default" is the rate charged when no size reaches the cost helper (the API
# default is 1280x720). sora-2 is flat across every size it supports; only
# sora-2-pro is tiered, and 1080p is Pro-only.
# Video rows re-verified against OpenAI's pricing page 2026-07-24
# (sora-2-pro is tiered by resolution; sora-2 is flat).
video_generation:
  sora-2:
    per_second_by_resolution: { default: 0.10, 720p: 0.10, 1024p: 0.10, 1080p: 0.10 }
  sora-2-pro:
    per_second_by_resolution: { default: 0.30, 720p: 0.30, 1024p: 0.50, 1080p: 0.70 }

# Fallbacks used when calculate_*() receives an unknown model id.
fallbacks:
  unknown_chat_model:   { input_per_million: 2.50, output_per_million: 10.00 }
  unknown_image_model:  { per_image: 0.034 }
  unknown_tts_model:    { per_character: 0.000015 }
  unknown_stt_model:    { per_minute: 0.006 }
  unknown_video_model:  { per_second: 0.10 }
